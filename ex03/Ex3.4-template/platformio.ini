[env:seeed-xiao-afruitnrf52-nrf52840-sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps =
    olikraus/U8g2
    Wire
    adafruit/Adafruit SGP30 Sensor
    adafruit/DHT sensor library
build_flags =
    -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Bluefruit52Lib/src
extra_scripts = /home/sduttlinger/.platformio/scripts/gen_clangd.py
